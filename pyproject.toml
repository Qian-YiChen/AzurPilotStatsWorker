[project]
name = "azurpilot-stats-worker"
version = "0.1.0"
description = "Durable screenshot recognition worker for AzurPilot"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "numpy>=2,<3", "opencv-python-headless>=4.11,<5", "pillow>=11,<13", "rich>=13,<15", "requests>=2.32,<3", "pyyaml>=6,<7", "lz4>=4.4,<5", "psutil>=7,<8"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
